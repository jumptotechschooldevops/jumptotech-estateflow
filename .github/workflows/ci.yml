name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (install, lint, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: estateflow
          POSTGRES_PASSWORD: estateflow
          POSTGRES_DB: estateflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estateflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: estateflow
          PGPASSWORD: estateflow
          PGDATABASE: estateflow
          REDIS_URL: redis://localhost:6379
        run: npx jest --runInBand --testTimeout=30000

  frontend:
    name: Frontend (install, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  docker-build:
    name: Docker build validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose config
        run: docker compose config --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: estateflow-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: estateflow-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan — backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: estateflow-backend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Trivy scan — frontend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: estateflow-frontend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
