name: Deploy to EKS

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for deployment"
        required: true
        type: string
      mode:
        description: "Execution mode"
        required: true
        default: validate-only
        type: choice
        options:
          - validate-only
          - deploy

permissions:
  id-token: write
  contents: read

concurrency:
  group: estateflow-staging-deployment
  cancel-in-progress: false

env:
  AWS_REGION: us-east-2
  EKS_CLUSTER_NAME: testingfile
  K8S_NAMESPACE: estateflow-staging
  BACKEND_IMAGE: real-estate-backend
  FRONTEND_IMAGE: real-estate-frontend
  ALB_URL: http://k8s-estateflow-63a182b76b-1391477840.us-east-2.elb.amazonaws.com

jobs:
  deploy:
    name: Validate and deploy EstateFlow
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log deployment request
        env:
          DEPLOY_REASON: ${{ inputs.reason }}
          DEPLOY_MODE: ${{ inputs.mode }}
        run: |
          printf 'Reason: %s\n' "$DEPLOY_REASON"
          printf 'Mode: %s\n' "$DEPLOY_MODE"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Configure Kubernetes access
        run: |
          aws eks update-kubeconfig \
            --name "$EKS_CLUSTER_NAME" \
            --region "$AWS_REGION"

      - name: Validate Kubernetes permissions
        run: |
          set -euo pipefail

          for app in backend frontend; do
            kubectl auth can-i patch deployment/$app \
              -n "$K8S_NAMESPACE"

            kubectl auth can-i watch deployment/$app \
              -n "$K8S_NAMESPACE"

            kubectl get deployment "$app" \
              -n "$K8S_NAMESPACE"
          done

          if kubectl auth can-i patch deployment/redis \
            -n "$K8S_NAMESPACE"; then
            echo "Unexpected Redis permissions"
            exit 1
          fi

          if kubectl auth can-i delete statefulset/postgres \
            -n "$K8S_NAMESPACE"; then
            echo "Unexpected PostgreSQL permissions"
            exit 1
          fi

      - name: Verify existing application health
        run: |
          curl -fsS --max-time 15 "$ALB_URL/api/health" |
            jq -e '.status == "ok" and .db == "up" and .redis == "up"'

      - name: Compute image tags
        if: inputs.mode == 'deploy'
        env:
          ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
        run: |
          TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          echo "BACKEND_URI=$ECR_REGISTRY/$BACKEND_IMAGE:$TAG" >> "$GITHUB_ENV"
          echo "FRONTEND_URI=$ECR_REGISTRY/$FRONTEND_IMAGE:$TAG" >> "$GITHUB_ENV"

      - name: Build backend image
        if: inputs.mode == 'deploy'
        run: |
          docker build \
            --platform linux/amd64 \
            -t "$BACKEND_URI" ./backend

      - name: Build frontend image
        if: inputs.mode == 'deploy'
        run: |
          docker build \
            --platform linux/amd64 \
            -t "$FRONTEND_URI" ./frontend

      - name: Trivy scan backend
        if: inputs.mode == 'deploy'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_URI }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Trivy scan frontend
        if: inputs.mode == 'deploy'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_URI }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Login to Amazon ECR
        if: inputs.mode == 'deploy'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push scanned images
        if: inputs.mode == 'deploy'
        run: |
          docker push "$BACKEND_URI"
          docker push "$FRONTEND_URI"

      - name: Record current deployment images
        if: inputs.mode == 'deploy'
        run: |
          kubectl get deployment backend \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="backend")].image}'

          echo

          kubectl get deployment frontend \
            -n "$K8S_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="frontend")].image}'

          echo

      - name: Deploy backend
        if: inputs.mode == 'deploy'
        run: |
          kubectl set image deployment/backend \
            backend="$BACKEND_URI" \
            -n "$K8S_NAMESPACE"

          kubectl rollout status deployment/backend \
            -n "$K8S_NAMESPACE" \
            --timeout=180s

      - name: Deploy frontend
        if: inputs.mode == 'deploy'
        run: |
          kubectl set image deployment/frontend \
            frontend="$FRONTEND_URI" \
            -n "$K8S_NAMESPACE"

          kubectl rollout status deployment/frontend \
            -n "$K8S_NAMESPACE" \
            --timeout=180s

      - name: Post-deployment smoke tests
        if: inputs.mode == 'deploy'
        run: |
          set -euo pipefail

          curl -fsS --retry 5 --retry-delay 5 \
            --max-time 15 "$ALB_URL/api/health" |
            jq -e '.status == "ok" and .db == "up" and .redis == "up"'

          curl -fsS --retry 5 --retry-delay 5 \
            --max-time 15 "$ALB_URL/api/properties" |
            jq -e 'type == "array"'

          curl -fsS --retry 5 --retry-delay 5 \
            --max-time 15 "$ALB_URL/" \
            -o /dev/null

      - name: Display application pods
        run: |
          kubectl get pods -n "$K8S_NAMESPACE"
