# Replace <ECR_REGISTRY> with your account's ECR registry (e.g. 123456789012.dkr.ecr.us-east-1.amazonaws.com)
# and <BACKEND_ROLE_ARN> with the IRSA role ARN created per infra/iam/README.md. The deploy
# workflow (.github/workflows/deploy.yml) updates the image tag with `kubectl set image` after
# this manifest has been applied once.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: estateflow-backend
  namespace: estateflow-staging
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::<AWS_ACCOUNT_ID>:role/<BACKEND_ROLE_ARN>
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: estateflow-staging
spec:
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: estateflow-staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: estateflow-backend
      securityContext:
        fsGroup: 1000
      containers:
        - name: backend
          image: 668484272259.dkr.ecr.us-east-2.amazonaws.com/real-estate-backend:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: estateflow-config
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: estateflow-secrets
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: estateflow-secrets
                  key: POSTGRES_PASSWORD
            - name: ADMIN_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: estateflow-secrets
                  key: ADMIN_API_TOKEN
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
