apiVersion: v1
kind: ConfigMap
metadata:
  name: estateflow-config
  namespace: estateflow-staging
data:
  PORT: "5000"
  PGHOST: postgres
  PGPORT: "5432"
  PGDATABASE: estateflow
  REDIS_URL: redis://redis:6379
  AWS_REGION: us-east-1
  # Set this to the real bucket name created per infra/s3/README.md before deploying.
  S3_BUCKET_NAME: estateflow-staging-property-images
