apiVersion: v1
kind: ConfigMap
metadata:
  name: estateflow-config
  namespace: {{ .Release.Namespace }}
data:
  PORT: {{ .Values.config.port | quote }}
  PGHOST: {{ .Values.config.pgHost | quote }}
  PGPORT: {{ .Values.config.pgPort | quote }}
  PGDATABASE: {{ .Values.config.pgDatabase | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  AWS_REGION: {{ .Values.aws.region | quote }}
  S3_BUCKET_NAME: {{ .Values.aws.s3.bucketName | quote }}
